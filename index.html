<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="perf-balanced">

  <!-- Browser Chrome -->
  <div id="browser-chrome">
    <!-- Tabs -->
    <div id="tabs-container">
      <button class="new-tab-btn" id="btn-new-tab" title="New Tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <!-- Navigation -->
    <div id="nav-area">
      <button class="nav-btn" id="btn-back" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button class="nav-btn" id="btn-forward" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <button class="nav-btn" id="btn-reload">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>

      <!-- Address Bar -->
      <div id="address-bar-container">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-gray)" stroke-width="2" style="margin-right: 8px;"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <input type="text" id="url-input" placeholder="Search or enter web address" spellcheck="false">
      </div>
    </div>
  </div>

  <!-- Web Content Area -->
  <div id="views-container"></div>

  <!--Notification-->
  <div id="update-banner" class="hidden">
  <div class="update-info">
    <span id="update-text">جاري تنزيل تحديث جديد...</span>
    <div id="update-progress-bar"><div id="update-progress-fill"></div></div>
    </div>
    <button id="btn-restart" class="hidden">تثبيت وإعادة التشغيل</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
