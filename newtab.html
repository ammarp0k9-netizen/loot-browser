<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="newtab.css"><title>New Tab</title></head><body><main><div class="brand-row"><div class="mark">L</div><span>LOOTBROWSER</span></div><p class="kicker">A QUIET PLACE TO EXPLORE</p><h1>Browse with <em>intent.</em></h1><form id="search-form"><input autofocus placeholder="Search the web or enter an address"><button>Search</button></form><div class="section-head"><span>Quick links</span><small>Stored on this device</small></div><section id="quick-links"></section><form id="shortcut-form" class="shortcut-form hidden"><input id="shortcut-name" maxlength="26" placeholder="Name"><input id="shortcut-url" placeholder="https://example.com"><button id="shortcut-save">Add</button><button class="cancel" type="button">Cancel</button></form><p class="hint">Your browsing session stays on this device.</p></main><script>
const defaults=[['LootLingua','https://lootlingua.vercel.app/','LL'],['YouTube','https://www.youtube.com','YT'],['GitHub','https://github.com','GH'],['Google','https://www.google.com','G']],key='lootbrowser.quick-links';let editing=null;const list=()=>{try{return JSON.parse(localStorage.getItem(key))||[]}catch{return[]}},safe=t=>String(t).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function draw(){const custom=list(),fixed=defaults.map(([n,u,m])=>`<a href="${u}"><b>${m}</b><span>${n}</span></a>`).join(''),mine=custom.map(([n,u,m],i)=>`<article class="shortcut"><a href="${safe(u)}"><b>${safe(m)}</b><span>${safe(n)}</span></a><div><button data-edit="${i}" type="button">Edit</button><button data-delete="${i}" type="button">Delete</button></div></article>`).join('');document.querySelector('#quick-links').innerHTML=fixed+mine+'<button class="add" type="button"><b>+</b><span>Add shortcut</span></button>';document.querySelector('.add').onclick=()=>openForm();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(+b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>{b.onclick=()=>{const a=list();a.splice(+b.dataset.delete,1);localStorage.setItem(key,JSON.stringify(a));draw()}})}function openForm(i){editing=Number.isInteger(i)?i:null;const f=document.querySelector('#shortcut-form'),v=editing===null?null:list()[editing];f.classList.remove('hidden');document.querySelector('#shortcut-name').value=v?.[0]||'';document.querySelector('#shortcut-url').value=v?.[1]||'';document.querySelector('#shortcut-save').textContent=v?'Save':'Add';document.querySelector('#shortcut-name').focus()}draw();document.querySelector('#shortcut-form').onsubmit=e=>{e.preventDefault();let n=document.querySelector('#shortcut-name').value.trim(),u=document.querySelector('#shortcut-url').value.trim();if(!n||!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;const a=list(),v=[n,u,n.slice(0,2).toUpperCase()];editing===null?a.push(v):a[editing]=v;localStorage.setItem(key,JSON.stringify(a));e.target.reset();e.target.classList.add('hidden');editing=null;draw()};document.querySelector('.cancel').onclick=()=>{document.querySelector('#shortcut-form').reset();document.querySelector('#shortcut-form').classList.add('hidden');editing=null};document.querySelector('#search-form').onsubmit=e=>{e.preventDefault();let v=e.target.querySelector('input').value.trim();if(v)location.href=/^(https?:\/\/|[\w-]+\.[\w-]+)/i.test(v)?(/^[a-z]+:\/\//i.test(v)?v:'https://'+v):'https://www.google.com/search?q='+encodeURIComponent(v)};
</script></body></html>
